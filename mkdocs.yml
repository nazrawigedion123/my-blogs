site_name: Nazrawi's Blogs
site_description: Technical notes, engineering lessons, and practical software guides.
site_author: Nazrawi Gedion

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      post_date_format: medium
      post_url_date_format: yyyy/MM/dd
      archive: true
      archive_name: Archives
      categories: true
      categories_name: Categories

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Blog:
      - Overview: blog/index.md
      - Posts:
          - Memory Usage and Optimizations in Go: blog/posts/memory-usage-and-optimizations-in-go.md
          - Using Go Generics to Optimize Hexagonal Architecture Performance: blog/posts/using-go-generics-to-optimize-hexagonal-architecture-code.md
          - Should Handlers Return an Error?: blog/posts/should-handlers-return-an-error.md
  - About: pages/about.md

extra_css:
  - stylesheets/extra.css
